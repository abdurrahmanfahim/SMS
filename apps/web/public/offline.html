<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F6E51" />
    <title>অফলাইন / Offline</title>
    <style>
      body { margin: 0; padding: 1.5rem; font-family: "Hind Siliguri", "Noto Sans Bengali", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 1rem; line-height: 1.65; color: #111827; background: #fff; }
      @media (prefers-color-scheme: dark) { body { color: #f3f4f6; background: #0b1220; } }
      main { max-width: 32rem; margin: 3rem auto; }
      h1 { font-size: 1.5rem; line-height: 1.5; }
      a { display: inline-block; min-height: 44px; padding: 0.6rem 1rem; border-radius: 0.5rem; background: #0f6e51; color: #fff; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না</h1>
      <p>সংযোগ ফিরে এলে আবার চেষ্টা করুন।</p>
      <h2>You are offline</h2>
      <p>Please try again when the connection is back.</p>
      <p><a href="/">আবার চেষ্টা করুন / Try again</a></p>
    </main>
  </body>
</html>
