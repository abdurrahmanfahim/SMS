name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ci / checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @sms/e2e exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Script tests (staging seed, bundle check)
        run: pnpm test:scripts

      # Fails the build if the web bundle contains the service-role key (or the text service_role).
      - name: Bundle must not contain the service-role key
        run: node scripts/check-bundle-secrets.mjs apps/web/dist

      - name: E2E smoke test
        timeout-minutes: 10
        run: pnpm e2e
        env:
          CI: true

  db:
    name: ci / db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # ubuntu-latest runners ship Docker pre-installed; `supabase start` uses
      # it to run Postgres + the rest of the local stack. No secrets needed —
      # this is entirely local/ephemeral, never the staging or prod project.
      - name: Start local Supabase
        run: pnpm db:start

      - name: Reset database (apply migrations + seed)
        run: pnpm db:reset

      - name: Run pgTAP tests (fails if any public table lacks RLS)
        run: pnpm db:test

      - name: Regenerate types and fail on drift
        run: |
          pnpm db:types
          if ! git diff --exit-code -- packages/db/src/types.ts; then
            # On pushes, publish the freshly generated file on a bot branch so it can be
            # merged without running Docker locally.
            if [ "${{ github.event_name }}" = "push" ]; then
              git config user.name "ci-bot"
              git config user.email "ci-bot@users.noreply.github.com"
              git add packages/db/src/types.ts
              git commit -q -m "chore(db): types generated by CI"
              git push -f origin HEAD:refs/heads/bot/db-types || true
            fi
            echo "::error::packages/db/src/types.ts is out of date. Run 'pnpm db:types' and commit the result (on pushes CI publishes it on branch bot/db-types)." >&2
            exit 1
          fi

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop
